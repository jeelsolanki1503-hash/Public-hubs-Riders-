<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D5C63">
  <meta name="description" content="Fixride: a fixed-fare, guaranteed ride home from Mumbai T2. Clickable prototype of the rider flow: sign up and lock a ride before landing.">
  <title>Fixride · Rider prototype</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens-rider.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="stage">
    <div class="phone" data-theme="light">
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time">9:41</span>
        <span class="statusbar__icons"></span>
      </div>
      <div class="viewport"></div>
      <div class="overlay-layer"></div>
      <div class="toast-region" aria-live="polite"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <aside class="devpanel" aria-label="Prototype panel"></aside>
  </div>
